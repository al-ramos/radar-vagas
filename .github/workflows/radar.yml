name: radar

on:
  schedule:
    - cron: "0 11 * * 1-5"   # 08h de Brasilia, dias uteis
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python radar/collect.py

      - run: python radar/score.py

      - run: python radar/notify.py
        continue-on-error: true
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}

      - name: gerar painel publico (docs/jobs.json)
        run: |
          mkdir -p docs
          python radar/export_json.py --out docs/jobs.json --somente-ativas

      - name: salvar painel
        run: |
          git config user.name "radar-bot"
          git config user.email "radar@users.noreply.github.com"
          git add docs/jobs.json
          git commit -m "coleta $(date +%F)" || echo "sem mudancas"
          git push

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de vagas — painel</title>
<style>
  :root{
    --bg:#f5ead8; --text:#201e1d; --surface:#ffffff; --divider:#e4d7bf;
    --accent:#c67139; --accent-100:#f3ddc9; --accent-700:#8a4a22; --accent-800:#6e3a1b;
    --sage-100:#e6ebde; --sage-700:#4f5d3c; --neutral-200:#ece2cd; --neutral-700:#6b5f4c; --neutral-800:#4a4136;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap{ display:flex; min-height:100vh; }
  aside{ flex:0 0 260px; padding:24px 16px; border-right:1px solid var(--divider); position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto; }
  aside p.kick{ font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-700); margin:0 0 4px; }
  aside p.brand{ font-size:20px; font-weight:700; margin:0 0 28px; }
  label{ display:block; font-size:12px; font-weight:700; color:var(--neutral-800); margin-bottom:6px; }
  select, input[type=text]{ width:100%; padding:9px 12px; border-radius:10px; border:1px solid var(--divider); font-size:13px; background:var(--surface); color:var(--text); margin-bottom:20px; }
  input[type=range]{ width:100%; margin-bottom:20px; }
  button{ width:100%; padding:9px 12px; border-radius:999px; border:1px solid var(--divider); background:var(--surface); color:var(--neutral-800); font-size:12.5px; font-weight:700; cursor:pointer; }
  button:hover{ background:var(--accent-100); }
  button:focus-visible, select:focus-visible, input:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  #copiarLink{ display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:10px; color:var(--accent-800); }
  main{ flex:1 1 auto; min-width:0; padding:24px 40px; }
  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px; }
  .stat{ border-radius:16px; padding:16px; background:var(--neutral-200); }
  .stat.a{ background:var(--accent-100); } .stat.b{ background:var(--sage-100); }
  .stat b{ display:block; font-size:26px; }
  .stat span{ font-size:12px; color:var(--neutral-800); }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; min-height:1px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; padding:5px 10px 5px 12px; border-radius:999px; background:var(--accent-100); color:var(--accent-800); font-size:12px; font-weight:700; }
  .chip button{ all:unset; cursor:pointer; line-height:1; font-size:13px; padding:0 2px; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; background:var(--surface); border-radius:16px; overflow:hidden; }
  thead tr{ background:var(--neutral-200); }
  th{ text-align:left; padding:12px 14px; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--neutral-700); user-select:none; }
  th.sortable{ cursor:pointer; }
  th.sortable:hover{ color:var(--accent-800); }
  th .arrow{ opacity:.5; margin-left:3px; }
  th.active .arrow{ opacity:1; color:var(--accent-700); }
  td{ padding:12px 14px; border-top:1px solid var(--divider); vertical-align:top; }
  td a{ font-weight:700; color:var(--text); text-decoration:none; }
  td a:hover{ color:var(--accent-800); }
  .empresa{ font-size:12px; color:var(--neutral-700); margin-top:2px; }
  .fonte{ font-size:10.5px; color:var(--sage-700); margin-top:2px; }
  .pts{ display:inline-block; min-width:34px; padding:5px 10px; border-radius:999px; font-weight:700; font-size:12.5px; text-align:center; }
  #vazio{ text-align:center; color:var(--neutral-700); padding:60px 0; }
  #erro{ color:#a33; padding:12px; }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <p class="kick">Radar de vagas</p>
    <p class="brand">Painel</p>
    <button id="copiarLink" type="button">🔗 Copiar link com filtros</button>
    <label>Buscar</label>
    <input type="text" id="fTexto" placeholder="empresa ou título">
    <label>Fonte</label>
    <select id="fFonte">
      <option value="todas">Todas</option>
      <option value="ats">ATS direto (Gupy/Greenhouse/etc)</option>
      <option value="jsonfeed">E-mails (LinkedIn/Infojobs/Catho)</option>
    </select>
    <label>Senioridade</label>
    <select id="fSenioridade">
      <option value="todas">Todas</option>
      <option value="estagio">Estágio</option>
      <option value="junior">Júnior</option>
      <option value="pleno">Pleno</option>
      <option value="senior">Sênior</option>
      <option value="especialista">Especialista</option>
      <option value="nao_informado">Não informada</option>
    </select>
    <label>Modalidade</label>
    <select id="fModalidade">
      <option value="todas">Todas</option>
      <option value="remoto">Remoto</option>
      <option value="hibrido">Híbrido</option>
      <option value="presencial">Presencial</option>
    </select>
    <label>Corte mínimo: <span id="corteLabel">0</span> pts</label>
    <input type="range" id="fCorte" min="0" max="100" step="5" value="0">
    <label>Ordenar por</label>
    <select id="fOrdenar">
      <option value="pontos">Pontuação</option>
      <option value="publicado_em">Mais recente</option>
      <option value="empresa">Empresa (A-Z)</option>
    </select>
    <button id="limpar">Limpar filtros</button>
  </aside>
  <main>
    <div id="erro" style="display:none;"></div>
    <div class="stats">
      <div class="stat a"><b id="stTotal">-</b><span id="stTotalLabel">vagas exibidas</span></div>
      <div class="stat b"><b id="stMedia">-</b><span>pontuação média</span></div>
      <div class="stat"><b id="stTop" style="font-size:18px;">-</b><span id="stTopLabel">empresa com mais vagas</span></div>
      <div class="stat"><b id="stAtt" style="font-size:18px;">-</b><span>última coleta</span></div>
    </div>
    <div class="chips" id="chips"></div>
    <table>
      <thead><tr>
        <th>Vaga</th><th>Local / modalidade</th><th>Senioridade</th><th>Stack</th>
        <th class="sortable" data-ord="pontos" style="text-align:center;">Pontos<span class="arrow">▾</span></th>
        <th class="sortable" data-ord="publicado_em" style="text-align:right;">Publicada<span class="arrow">▾</span></th>
      </tr></thead>
      <tbody id="corpo"></tbody>
    </table>
    <p id="vazio" style="display:none;">Nenhuma vaga corresponde aos filtros atuais.</p>
  </main>
</div>
<script>
const SENIOR_LABEL = { estagio:'Estágio', junior:'Júnior', pleno:'Pleno', senior:'Sênior', especialista:'Especialista', nao_informado:'Não informada' };
const FONTE_LABEL = { jsonfeed:'E-mail (LinkedIn/Infojobs/Catho)' };
let JOBS = [];

function ehFonteEmail(j){ return j.fonte === 'jsonfeed'; }

function lerFiltrosDaUrl(){
  const p = new URLSearchParams(location.search);
  if (p.has('q')) document.getElementById('fTexto').value = p.get('q');
  if (p.has('fonte')) document.getElementById('fFonte').value = p.get('fonte');
  if (p.has('sen')) document.getElementById('fSenioridade').value = p.get('sen');
  if (p.has('mod')) document.getElementById('fModalidade').value = p.get('mod');
  if (p.has('corte')) document.getElementById('fCorte').value = p.get('corte');
  if (p.has('ord')) document.getElementById('fOrdenar').value = p.get('ord');
}

function escreverFiltrosNaUrl(){
  const p = new URLSearchParams();
  const texto = document.getElementById('fTexto').value.trim();
  const fonte = document.getElementById('fFonte').value;
  const sen = document.getElementById('fSenioridade').value;
  const mod = document.getElementById('fModalidade').value;
  const corte = document.getElementById('fCorte').value;
  const ord = document.getElementById('fOrdenar').value;
  if (texto) p.set('q', texto);
  if (fonte !== 'todas') p.set('fonte', fonte);
  if (sen !== 'todas') p.set('sen', sen);
  if (mod !== 'todas') p.set('mod', mod);
  if (Number(corte) > 0) p.set('corte', corte);
  if (ord !== 'pontos') p.set('ord', ord);
  const qs = p.toString();
  history.replaceState(null, '', qs ? '?' + qs : location.pathname);
}

function corPontos(p){
  if (p >= 70) return { bg:'var(--sage-100)', tx:'var(--sage-700)' };
  if (p >= 40) return { bg:'var(--accent-100)', tx:'var(--accent-800)' };
  return { bg:'var(--neutral-200)', tx:'var(--neutral-700)' };
}
function diasDesde(iso){
  if(!iso) return '-';
  const d = Math.floor((Date.now() - new Date(iso+'T00:00:00').getTime())/86400000);
  if (Number.isNaN(d)) return iso;
  if (d<=0) return 'hoje';
  if (d===1) return 'ontem';
  return d+' dias';
}

function renderChips(){
  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  const add = (label, onRemove) => {
    const c = document.createElement('span');
    c.className = 'chip';
    c.innerHTML = `${label} <button type="button" aria-label="remover filtro">✕</button>`;
    c.querySelector('button').addEventListener('click', () => { onRemove(); atualizar(); });
    chips.appendChild(c);
  };
  const texto = document.getElementById('fTexto').value.trim();
  const fonte = document.getElementById('fFonte').value;
  const sen = document.getElementById('fSenioridade').value;
  const mod = document.getElementById('fModalidade').value;
  const corte = Number(document.getElementById('fCorte').value);
  if (texto) add('busca: "' + texto + '"', () => document.getElementById('fTexto').value = '');
  if (fonte !== 'todas') add(fonte === 'jsonfeed' ? 'fonte: e-mail' : 'fonte: ATS direto', () => document.getElementById('fFonte').value = 'todas');
  if (sen !== 'todas') add(SENIOR_LABEL[sen] || sen, () => document.getElementById('fSenioridade').value = 'todas');
  if (mod !== 'todas') add(mod, () => document.getElementById('fModalidade').value = 'todas');
  if (corte > 0) add('≥ ' + corte + ' pts', () => document.getElementById('fCorte').value = 0);
}

let sortState = { campo: 'pontos', dir: -1 };

function render(){
  const texto = document.getElementById('fTexto').value.trim().toLowerCase();
  const fonte = document.getElementById('fFonte').value;
  const sen = document.getElementById('fSenioridade').value;
  const mod = document.getElementById('fModalidade').value;
  const corte = Number(document.getElementById('fCorte').value);
  const ord = document.getElementById('fOrdenar').value;
  document.getElementById('corteLabel').textContent = corte;

  let filtradas = JOBS.filter(j=>{
    if (sen !== 'todas' && j.senioridade !== sen) return false;
    if (mod !== 'todas' && j.modalidade !== mod) return false;
    if (fonte === 'jsonfeed' && !ehFonteEmail(j)) return false;
    if (fonte === 'ats' && ehFonteEmail(j)) return false;
    if ((j.pontos||0) < corte) return false;
    if (texto){
      const alvo = ((j.titulo||'')+' '+(j.empresa||'')).toLowerCase();
      if (!alvo.includes(texto)) return false;
    }
    return true;
  });

  const campo = sortState.campo === ord ? sortState.campo : ord;
  filtradas.sort((a,b)=>{
    if (campo==='empresa') return sortState.dir * (a.empresa||'').localeCompare(b.empresa||'') * -1;
    if (campo==='publicado_em') return sortState.dir * ((a.publicado_em||'').localeCompare(b.publicado_em||''));
    return sortState.dir * ((a.pontos||0)-(b.pontos||0));
  });

  document.querySelectorAll('th.sortable').forEach(th=>{
    th.classList.toggle('active', th.dataset.ord === campo);
    th.querySelector('.arrow').textContent = (th.dataset.ord === campo && sortState.dir === 1) ? '▴' : '▾';
  });

  document.getElementById('stTotal').textContent = filtradas.length;
  document.getElementById('stTotalLabel').textContent = 'vagas exibidas de ' + JOBS.length;
  const media = JOBS.length ? Math.round(JOBS.reduce((s,j)=>s+(j.pontos||0),0)/JOBS.length) : 0;
  document.getElementById('stMedia').textContent = media;

  const contagem = {};
  JOBS.forEach(j=>{ contagem[j.empresa]=(contagem[j.empresa]||0)+1; });
  let topE='-', topN=0;
  Object.entries(contagem).forEach(([n,c])=>{ if(c>topN){topE=n;topN=c;} });
  document.getElementById('stTop').textContent = topE;
  document.getElementById('stTopLabel').textContent = 'empresa com mais vagas (' + topN + ')';

  const ultima = JOBS.reduce((m,j)=> (j.ultima_vez>m ? j.ultima_vez : m), '');
  document.getElementById('stAtt').textContent = ultima || '-';

  const corpo = document.getElementById('corpo');
  corpo.innerHTML = '';
  filtradas.forEach(j=>{
    const cor = corPontos(j.pontos||0);
    const tr = document.createElement('tr');
    const fonteTag = ehFonteEmail(j) ? `<div class="fonte">${FONTE_LABEL.jsonfeed}</div>` : '';
    tr.innerHTML = `
      <td><a href="${j.url||'#'}" target="_blank" rel="noopener">${j.titulo||''}</a><div class="empresa">${j.empresa||''}</div>${fonteTag}</td>
      <td>${j.local||'-'}<div style="font-size:11.5px;color:var(--neutral-700);text-transform:capitalize;">${j.modalidade||''}</div></td>
      <td style="text-transform:capitalize;">${SENIOR_LABEL[j.senioridade]||j.senioridade||'-'}</td>
      <td style="font-size:12.5px;max-width:220px;">${j.stack||'-'}</td>
      <td style="text-align:center;"><span class="pts" style="background:${cor.bg};color:${cor.tx};">${Math.round(j.pontos||0)}</span></td>
      <td style="text-align:right;font-size:12.5px;color:var(--neutral-700);">${diasDesde(j.publicado_em)}</td>`;
    corpo.appendChild(tr);
  });
  document.getElementById('vazio').style.display = filtradas.length ? 'none' : 'block';
}

function atualizar(){
  renderChips();
  render();
  escreverFiltrosNaUrl();
}

['fTexto','fFonte','fSenioridade','fModalidade','fCorte','fOrdenar'].forEach(id=>{
  document.getElementById(id).addEventListener('input', atualizar);
});
document.querySelectorAll('th.sortable').forEach(th=>{
  th.addEventListener('click', () => {
    const campo = th.dataset.ord;
    if (sortState.campo === campo) sortState.dir *= -1;
    else { sortState.campo = campo; sortState.dir = -1; }
    document.getElementById('fOrdenar').value = campo;
    atualizar();
  });
});
document.getElementById('limpar').addEventListener('click', ()=>{
  document.getElementById('fTexto').value='';
  document.getElementById('fFonte').value='todas';
  document.getElementById('fSenioridade').value='todas';
  document.getElementById('fModalidade').value='todas';
  document.getElementById('fCorte').value=0;
  document.getElementById('fOrdenar').value='pontos';
  atualizar();
});
document.getElementById('copiarLink').addEventListener('click', () => {
  escreverFiltrosNaUrl();
  navigator.clipboard.writeText(location.href).then(() => {
    const b = document.getElementById('copiarLink');
    const orig = b.textContent;
    b.textContent = '✓ Link copiado';
    setTimeout(() => { b.textContent = orig; }, 1500);
  });
});

lerFiltrosDaUrl();

fetch('./jobs.json', { cache: 'no-store' })
  .then(r=>{ if(!r.ok) throw new Error('jobs.json ainda não existe neste endereço'); return r.json(); })
  .then(data=>{ JOBS = Array.isArray(data)?data:[]; atualizar(); })
  .catch(err=>{
    document.getElementById('erro').style.display='block';
    document.getElementById('erro').textContent = 'Não consegui carregar jobs.json: ' + err.message + '. Rode o workflow ao menos uma vez para gerar este arquivo.';
  });
</script>
</body>
</html>

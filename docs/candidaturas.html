<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidaturas — histórico público</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="./">📡 Radar de vagas</a>
    <div class="ms-auto"><a class="btn btn-outline-light btn-sm" href="./">Voltar ao painel</a></div>
  </div>
</nav>

<main class="container py-4">
  <h1 class="h3">Histórico de candidaturas</h1>
  <p class="text-muted">Somente leitura. Lista as vagas marcadas como <b>candidatei</b> no painel, com a data em que foram marcadas.</p>

  <div class="d-flex gap-3 flex-wrap mb-3">
    <div class="card"><div class="card-body py-2 px-3"><div class="small text-muted">Total</div><div class="h4 mb-0" id="kpiTotal">—</div></div></div>
    <div class="card"><div class="card-body py-2 px-3"><div class="small text-muted">Últimos 30 dias</div><div class="h4 mb-0" id="kpi30">—</div></div></div>
    <div class="card"><div class="card-body py-2 px-3"><div class="small text-muted">Empresas distintas</div><div class="h4 mb-0" id="kpiEmpresas">—</div></div></div>
  </div>

  <input type="search" id="busca" class="form-control mb-3" placeholder="Filtrar por empresa, cargo ou stack…">

  <div class="table-responsive">
    <table class="table table-hover align-middle bg-white">
      <thead class="table-light">
        <tr><th>Data</th><th>Vaga</th><th>Empresa</th><th>Local / modalidade</th><th>Stack</th></tr>
      </thead>
      <tbody id="corpo"></tbody>
    </table>
  </div>
  <p id="vazio" class="text-center text-muted py-5 d-none">Nenhuma candidatura registrada ainda.</p>
</main>

<script>
const SENIOR = { junior: 'Júnior', pleno: 'Pleno', senior: 'Sênior', especialista: 'Especialista' };
let DADOS = [];

function dataBr(iso){
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function render(){
  const q = document.getElementById('busca').value.trim().toLowerCase();
  const lista = DADOS.filter(j => !q || `${j.titulo} ${j.empresa} ${j.stack} ${j.local}`.toLowerCase().includes(q));
  const corpo = document.getElementById('corpo');
  corpo.innerHTML = lista.map(j => `
    <tr>
      <td class="text-nowrap small">${dataBr(j.status_atualizado_em)}</td>
      <td><a href="${j.url || '#'}" target="_blank" rel="noopener" class="text-decoration-none">${j.titulo || ''}</a>
        <div class="small text-muted">${SENIOR[j.senioridade] || ''}</div></td>
      <td>${j.empresa || ''}</td>
      <td class="small">${[j.local, j.modalidade].filter(Boolean).join(' · ') || '—'}</td>
      <td class="small">${j.stack || '—'}</td>
    </tr>`).join('');
  document.getElementById('vazio').classList.toggle('d-none', lista.length > 0);
}

fetch('candidaturas.json?v=' + Date.now())
  .then(r => r.ok ? r.json() : [])
  .then(d => {
    DADOS = d || [];
    document.getElementById('kpiTotal').textContent = DADOS.length;
    const limite = Date.now() - 30 * 864e5;
    document.getElementById('kpi30').textContent = DADOS.filter(j => new Date(j.status_atualizado_em) >= limite).length;
    document.getElementById('kpiEmpresas').textContent = new Set(DADOS.map(j => j.empresa)).size;
    render();
  })
  .catch(() => { document.getElementById('vazio').classList.remove('d-none'); });

document.getElementById('busca').addEventListener('input', render);
</script>
</body>
</html>
